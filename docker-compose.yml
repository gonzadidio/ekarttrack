services:
  postgres:
    image: postgres:16-alpine
    container_name: ekarttrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekarttrack
    ports:
      - "5432:5432"
    volumes:
      - ekarttrack_data:/var/lib/postgresql/data

volumes:
  ekarttrack_data:
